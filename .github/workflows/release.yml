name: Release OSC Flow Studio package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: livepix-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Publish ZIP, SHA-256 and catalog together
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
