services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livepix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-livepix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending Prisma migrations, then exits. The app starts only after it succeeds.
  migrate:
    build: .
    env_file: .env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
